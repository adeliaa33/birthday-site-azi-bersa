<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Ucapan Ulang Tahun - Azi Bersa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        let isAudioPlaying = false;
        let audioCtx = null;
        let melodyInterval = null;
        let melodyTimeoutIds = [];
        let micStream = null;
        let isCandleBlown = false;
        let countdownTimer = null;
        let isLoadingFinished = false;

        // Finish Loading Screen Transition with Fallback Protection
        function finishLoading() {
            if (isLoadingFinished) return;
            isLoadingFinished = true;

            const loadingScreen = document.getElementById('loading-screen');
            const mainContent = document.getElementById('main-content');
            
            if (mainContent) {
                mainContent.classList.remove('opacity-0');
            }
            
            if (loadingScreen) {
                loadingScreen.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 500);
            }
        }

        // Floating Hearts Background Generator
        function createFloatingHearts() {
            const container = document.getElementById('heart-container');
            if (!container) return;
            const heartSymbols = ['❤️', '💖', '💕', '💗', '✨', '⭐'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'absolute text-xl opacity-30 select-none pointer-events-none';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * 100 + 'vh';
                heart.style.animation = `float ${3 + Math.random() * 3}s ease-in-out infinite`;
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                container.appendChild(heart);
            }
        }

        /* Glassmorphism Design Tokens - Crimson & Gold Theme */
        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(220, 20, 60, 0.22);
            box-shadow: 0 8px 32px 0 rgba(220, 20, 60, 0.12);
        }

        .glass-dock {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 12px 36px 0 rgba(230, 25, 25, 0.15);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.5);
        }

        /* Pulsating Loading Heart */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }
        .animate-heartbeat {
            animation: heartbeat 1.2s infinite ease-in-out;
        }

        /* Floating elements */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Rolling Gift Animation */
        @keyframes giftRoll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.1); }
            50% { transform: rotate(15deg) scale(1.1); }
            75% { transform: rotate(-10deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .animate-gift-roll {
            animation: giftRoll 1s ease-in-out infinite;
        }

        /* Candle Flame Flicker */
        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.95) rotate(-2deg); }
        }
        .animate-flicker {
            animation: flicker 0.6s infinite ease-in-out;
        }

        /* Gentle Sway Animation */
        @keyframes gentleSway {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }
        .animate-sway {
            animation: gentleSway 3s ease-in-out infinite;
        }

        /* Custom Scrollbar - Crimson Red Theme */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #ffeaea;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #DC143C;
            border-radius: 10px;
        }

        /* Pulsing Big Heart Effect */
        @keyframes heartbeatBig {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .animate-heart-pulse {
            animation: heartbeatBig 1.8s ease-in-out infinite;
        }

        /* Photo Transition */
        .photo-slide {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between text-slate-800 relative bg-[#fff5f5] transition-colors duration-500" id="body-bg">

    <div id="heart-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <div id="loading-screen" class="fixed inset-0 bg-[#fff5f5] z-50 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="flex flex-col items-center justify-center gap-4">
            <div class="text-[#E61919] text-6xl animate-heartbeat drop-shadow-md cursor-pointer" onclick="finishLoading()">
                ❤️
            </div>
            <div class="w-20 h-[4px] bg-[#FF6B6B]/30 rounded-full overflow-hidden mt-1 backdrop-blur-sm">
                <div id="progress-bar" class="h-full bg-[#DC143C] animate-pulse rounded-full"></div>
            </div>
        </div>
    </div>

    <main id="main-content" class="w-full max-w-md min-h-screen flex flex-col items-center px-5 pt-8 pb-32 relative z-10 opacity-0 transition-opacity duration-700">
        
        <div id="view-home" class="w-full flex flex-col items-center">
            <!-- Top Section Header -->
            <div class="text-center w-full mt-2 relative">
                <p class="text-[#DC143C] font-semibold text-lg tracking-wide">Untuk yang tersayang</p>
                
                <div class="relative inline-block mt-1">
                    <h1 class="text-5xl font-extrabold text-[#E61919] tracking-tight font-fredoka drop-shadow-sm">
                        Azi Bersa
                    </h1>
                    <span class="absolute -top-1 -right-6 text-[#DC143C] text-sm animate-bounce" style="animation-delay: 0.2s;">❤️</span>
                    <span class="absolute -bottom-2 -left-6 text-[#FFD700] text-base animate-pulse">✨</span>
                    <span class="absolute top-1/2 -right-10 text-[#FF6B6B] text-xs transform translate-y-full">🤍</span>
                </div>
            </div>

            <!-- Center Image Circle with Crowned Panda GIF -->
            <div class="relative my-6 flex items-center justify-center animate-float">
                <div class="absolute inset-0 rounded-full bg-[#FF6B6B] filter blur-xl opacity-40 scale-110"></div>
                <div class="w-64 h-64 rounded-full border-[5px] border-white bg-white/70 backdrop-blur-md shadow-xl overflow-hidden flex items-center justify-center relative z-10">
                    <img src="pandakueulangtahun.gif" onerror="this.src='https://placehold.co/400x400/DC143C/ffffff?text=Azi+Bersa'" alt="Panda Birthday" class="w-full h-full object-cover rounded-full">
                </div>
                <span class="absolute -top-2 -left-2 text-[#E61919] text-xl transform -rotate-12 animate-bounce">❤️</span>
                <span class="absolute bottom-6 -right-4 text-[#FFD700] text-2xl transform rotate-12 animate-pulse">✨</span>
                <span class="absolute top-1/2 -left-6 text-[#FF6B6B] text-lg">🤍</span>
            </div>

            <!-- Middle Greeting -->
            <div class="text-center w-full my-2">
                <h2 class="text-3xl font-extrabold text-[#DC143C] font-fredoka leading-tight tracking-snug">
                    Selamat Ulang Tahun<br>Sayang!
                </h2>
                
                <div class="flex items-center justify-center gap-2 mt-3 text-[#E61919] font-bold text-lg">
                    <span class="text-xl">🎉</span>
                    <span class="text-[#DAA520] text-sm">✨</span>
                    <span class="tracking-wide">07 November 2026</span>
                    <span class="text-xl">🎉</span>
                </div>
            </div>

            <!-- Quote Box with Glassmorphism -->
            <div class="w-full glass-card rounded-2xl p-5 mt-4 relative">
                <p class="italic text-slate-800 text-sm md:text-base leading-relaxed text-center font-medium">
                    "happy birthday my sweet boy! ❤ today and everyday, only wishing the best for you 🫶"
                </p>
                <p class="text-right text-[#DC143C] font-bold text-sm mt-3 pr-2">
                    - Adelia
                </p>
            </div>

            <!-- Buka Hadiah Spesial Button -->
            <div class="w-full mt-8 flex justify-center">
                <button onclick="goToGiftIntro()" class="w-full bg-gradient-to-r from-[#E61919] via-[#DC143C] to-[#FF4500] hover:from-[#DC143C] hover:to-[#E61919] text-white font-bold py-4 px-8 rounded-full shadow-lg hover:shadow-xl transform active:scale-95 transition-all duration-200 flex items-center justify-center gap-3 text-lg">
                    <span class="text-2xl">🎁</span>
                    <span>Buka Hadiah Spesial</span>
                </button>
            </div>
        </div>

        <div id="view-gift-intro" class="w-full hidden flex-col items-center justify-center min-h-[70vh] text-center">
            <div onclick="openGiftBox()" class="cursor-pointer transform hover:scale-105 transition-transform duration-300 my-8">
                <svg width="220" height="220" viewBox="0 0 200 200" class="drop-shadow-2xl">
                    <rect x="25" y="60" width="150" height="120" rx="12" fill="#DC143C"/>
                    <rect x="85" y="60" width="30" height="120" fill="#FFD700"/>
                    <rect x="25" y="110" width="150" height="25" fill="#FFD700"/>
                    <rect x="15" y="45" width="170" height="25" rx="6" fill="#E61919"/>
                    <rect x="85" y="45" width="30" height="25" fill="#DAA520"/>
                    <circle cx="100" cy="35" r="22" fill="#FFD700"/>
                    <circle cx="100" cy="35" r="12" fill="#DAA520"/>
                </svg>
            </div>
            <p class="text-[#E61919] font-bold text-xl md:text-2xl mt-4 tracking-wide font-fredoka">
                Klik untuk membuka hadiah spesial!
            </p>
        </div>

        <div id="view-gift-loading" class="w-full hidden flex-col items-center justify-center min-h-[70vh] text-center">
            <div class="animate-gift-roll my-8">
                <div class="text-8xl">🎁</div>
            </div>
            <p class="text-[#DC143C] font-bold text-2xl tracking-wide font-fredoka animate-pulse mt-4">
                Membuka hadiah...
            </p>
        </div>

        <div id="view-candle" class="w-full hidden flex-col items-center justify-center min-h-[75vh] text-center text-slate-800 pt-4 relative">
            <div class="flex items-center justify-center gap-2 mb-1">
                <span class="text-3xl animate-bounce">🎉</span>
                <h2 class="text-3xl md:text-4xl font-extrabold text-[#E61919] font-fredoka drop-shadow-sm">
                    Happy Birthday My Love!
                </h2>
                <span class="text-3xl animate-bounce">🎉</span>
            </div>

            <p class="text-[#DC143C] text-sm md:text-base font-bold mt-1 mb-4">
                Panjatkan doa dan tiup lilinnya 🎂<br>
                <span class="text-xs text-[#DAA520] font-semibold">(gunakan suaramu atau ketuk apinya!)</span>
            </p>

            <div class="relative flex flex-col items-center justify-center my-2 cursor-pointer select-none" onclick="blowOutCandle()">
                <svg viewBox="0 -40 320 270" class="w-72 md:w-80 h-auto drop-shadow-2xl z-10">
                    <ellipse cx="160" cy="220" rx="150" ry="10" fill="#cbd5e1"/>
                    <ellipse cx="160" cy="217" rx="142" ry="8" fill="#ffffff"/>

                    <!-- TIER 1 -->
                    <path d="M 35 150 L 35 205 Q 160 228 285 205 L 285 150 Z" fill="#3d2314"/>
                    <path d="M 35 175 Q 160 198 285 175 L 285 181 Q 160 204 35 181 Z" fill="#fef3c7" opacity="0.9"/>
                    <ellipse cx="160" cy="150" rx="125" ry="18" fill="#4a2c1d"/>
                    <path d="M 35 150 Q 50 172 62 154 Q 78 180 92 152 Q 110 178 128 152 Q 148 185 160 154 Q 175 180 192 152 Q 210 175 225 152 Q 242 182 255 152 Q 268 170 285 150 Q 160 170 35 150 Z" fill="#23130a"/>

                    <!-- TIER 2 -->
                    <path d="M 65 95 L 65 145 Q 160 165 255 145 L 255 95 Z" fill="#4a2c1d"/>
                    <path d="M 65 116 Q 160 136 255 116 L 255 122 Q 160 142 65 122 Z" fill="#fef3c7" opacity="0.9"/>
                    <ellipse cx="160" cy="95" rx="95" ry="15" fill="#5c3826"/>
                    <path d="M 65 95 Q 80 115 92 97 Q 108 122 122 97 Q 140 125 160 98 Q 178 122 195 97 Q 212 118 228 97 Q 242 115 255 95 Q 160 112 65 95 Z" fill="#23130a"/>

                    <!-- TIER 3 -->
                    <path d="M 98 42 L 98 90 Q 160 108 222 90 L 222 42 Z" fill="#5c3826"/>
                    <path d="M 98 62 Q 160 78 222 62 L 222 67 Q 160 83 98 67 Z" fill="#fef3c7" opacity="0.9"/>
                    <ellipse cx="160" cy="42" rx="62" ry="12" fill="#6d422d"/>
                    <path d="M 98 42 Q 112 60 124 44 Q 138 65 152 44 Q 168 68 180 44 Q 195 62 210 44 Q 218 58 222 42 Q 160 56 98 42 Z" fill="#23130a"/>

                    <!-- TOPPINGS -->
                    <circle cx="112" cy="40" r="7" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
                    <circle cx="134" cy="44" r="7" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
                    <circle cx="186" cy="44" r="7" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
                    <circle cx="208" cy="40" r="7" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>

                    <!-- CANDLE EMBEDDED IN CAKE -->
                    <g id="candle-stick">
                        <rect x="152" y="-2" width="16" height="46" rx="3" fill="url(#candleGradient)" stroke="#DC143C" stroke-width="1.5"/>
                        <line x1="152" y1="8" x2="168" y2="8" stroke="#DC143C" stroke-width="2.5" opacity="0.6"/>
                        <line x1="152" y1="18" x2="168" y2="18" stroke="#DC143C" stroke-width="2.5" opacity="0.6"/>
                        <line x1="152" y1="28" x2="168" y2="28" stroke="#DC143C" stroke-width="2.5" opacity="0.6"/>
                        <line x1="152" y1="38" x2="168" y2="38" stroke="#DC143C" stroke-width="2.5" opacity="0.6"/>
                        <line x1="160" y1="-2" x2="160" y2="-10" stroke="#2d2d2d" stroke-width="2.5" stroke-linecap="round"/>
                    </g>

                    <g id="candle-flame" class="animate-flicker transition-all duration-500">
                        <circle cx="160" cy="-22" r="18" fill="#FFD700" opacity="0.45" class="animate-pulse"/>
                        <path d="M 160 -38 Q 172 -20 160 -10 Q 148 -20 160 -38 Z" fill="#FFD700"/>
                        <path d="M 160 -32 Q 167 -18 160 -11 Q 153 -18 160 -32 Z" fill="#FF4500"/>
                        <path d="M 160 -25 Q 163 -16 160 -12 Q 157 -16 160 -25 Z" fill="#ffffff"/>
                    </g>

                    <g id="candle-smoke" class="hidden opacity-0 transition-opacity duration-700">
                        <path d="M 160 -12 Q 152 -22 158 -32 Q 166 -42 160 -52" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.7" class="animate-pulse"/>
                    </g>

                    <defs>
                        <linearGradient id="candleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FF6B6B"/>
                            <stop offset="50%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#E61919"/>
                        </linearGradient>
                    </defs>
                </svg>

                <div id="candle-smoke-badge" class="hidden opacity-0 transition-opacity duration-700 mt-[-10px] z-20">
                    <span class="text-xs text-[#E61919] font-bold bg-white/95 px-3 py-1 rounded-full shadow border border-[#FFD700]">
                        Keinginan terwujud! ✨
                    </span>
                </div>
            </div>

            <div id="blow-status" class="mt-4 glass-card px-6 py-2.5 rounded-full text-[#DC143C] text-xs font-semibold border border-[#FFD700]/50 shadow-md">
                🎙️ Mendengarkan tiupanmu... (atau ketuk apinya!)
            </div>
        </div>

        <div id="view-countdown" class="w-full hidden flex-col items-center text-center pt-2 pb-10">
            <h1 class="text-3xl font-black font-fredoka tracking-tight mb-3">
                <span class="text-[#DC143C]">The Birthday of </span>
                <span class="text-[#E61919]">Azi Bersa</span>
            </h1>

            <!-- Toggle Mode Display (Slider Mode vs Collage Grid Mode) -->
            <div class="flex items-center justify-center gap-2 mb-3 bg-white/80 p-1.5 rounded-full shadow-sm border border-[#FF6B6B]/30 text-xs font-bold">
                <button id="btn-mode-slider" onclick="setPhotoLayout('slider')" class="px-3 py-1 rounded-full bg-[#DC143C] text-white transition-all">
                    📸 Slide Show
                </button>
                <button id="btn-mode-grid" onclick="setPhotoLayout('grid')" class="px-3 py-1 rounded-full text-[#DC143C] hover:bg-red-50 transition-all">
                    🖼️ Grid Kolase
                </button>
            </div>

            <!-- CONTAINER FOTO - TATA LETAK 1: SLIDER / CAROUSEL (2 FOTO) -->
            <div id="photo-container-slider" class="w-full max-w-xs glass-card rounded-3xl p-3.5 relative flex flex-col items-center animate-sway">
                <div class="absolute -top-3 flex justify-center gap-3 w-full z-20">
                    <span class="text-[#E61919] text-xl animate-bounce" style="animation-delay: 0.1s;">❤</span>
                    <span class="text-[#FFD700] text-base animate-pulse" style="animation-delay: 0.3s;">✨</span>
                </div>

                <!-- Slide Frame with Polaroid Glass Border -->
                <div class="w-full h-56 rounded-2xl bg-white shadow-md relative overflow-hidden flex items-center justify-center border-2 border-red-100 group">
                    <!-- Foto 1 -->
                    <img id="slide-img-0" src="bubududumerayakan.gif" onerror="this.src='https://placehold.co/400x400/E61919/ffffff?text=bubududumerayakan.gif'" alt="Foto 1" class="photo-slide absolute inset-0 w-full h-full object-cover opacity-100 scale-100">
                    
                    <!-- Foto 2 -->
                    <img id="slide-img-1" src="bubuhappy.gif" onerror="this.src='https://placehold.co/400x400/DC143C/ffffff?text=bubuhappy.gif'" alt="Foto 2" class="photo-slide absolute inset-0 w-full h-full object-cover opacity-0 scale-95 pointer-events-none">

                    <!-- Overlay Gradient & Caption -->
                    <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent p-2.5 text-white text-left z-10 flex justify-between items-end">
                        <span id="slide-caption" class="text-xs font-semibold drop-shadow">Momen Manis Kita ❤️ (1/2)</span>
                        <span class="text-[10px] bg-white/30 backdrop-blur-md px-2 py-0.5 rounded-full font-bold">Azi & Adelia</span>
                    </div>

                    <!-- Navigasi Panah Kiri & Kanan -->
                    <button onclick="prevPhoto()" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/80 hover:bg-white text-[#DC143C] flex items-center justify-center shadow z-20 active:scale-90 transition-transform">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button onclick="nextPhoto()" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white/80 hover:bg-white text-[#DC143C] flex items-center justify-center shadow z-20 active:scale-90 transition-transform">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <!-- Indikator Titik (Dots) -->
                <div class="flex items-center gap-2 mt-3">
                    <button onclick="goToPhoto(0)" id="dot-0" class="w-3.5 h-3.5 rounded-full bg-[#E61919] shadow transition-all"></button>
                    <button onclick="goToPhoto(1)" id="dot-1" class="w-2.5 h-2.5 rounded-full bg-red-200 transition-all cursor-pointer"></button>
                </div>
            </div>

            <!-- CONTAINER FOTO - TATA LETAK 2: ESTETIK GRID KOLASE (2 FOTO EQUAL) -->
            <div id="photo-container-grid" class="w-full max-w-xs glass-card rounded-3xl p-3 relative flex-col items-center hidden">
                <div class="grid grid-cols-2 gap-2 w-full">
                    <!-- Foto 1 -->
                    <div class="h-36 rounded-2xl overflow-hidden shadow-sm border border-red-100 relative">
                        <img src="bubududumerayakan.gif" onerror="this.src='https://placehold.co/200x200/E61919/ffffff?text=bubududumerayakan.gif'" alt="Foto 1" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                        <span class="absolute bottom-1.5 left-2 bg-black/40 text-white text-[10px] px-2 py-0.5 rounded-full font-medium backdrop-blur-sm">Kenangan 1</span>
                    </div>
                    <!-- Foto 2 -->
                    <div class="h-36 rounded-2xl overflow-hidden shadow-sm border border-red-100 relative">
        // Initialize App on DOM Ready (Fast & Reliable)
        document.addEventListener('DOMContentLoaded', () => {
            createFloatingHearts();
            startCountdown();
            
            // Automatically finish loading within 1.2 seconds max without waiting for heavy GIFs
            setTimeout(finishLoading, 1200);
        });

        // Safety fallback: Force unlock after 2 seconds no matter what
        setTimeout(finishLoading, 2000);
    </script>
</body>
</html>
