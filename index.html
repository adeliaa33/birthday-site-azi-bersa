<!-- SECTION 1: DASHBOARD (HOME) -->
<section id="home" class="hero-dashboard-bg text-white relative overflow-hidden pt-12 pb-14 md:pt-16 md:pb-20 border-b border-navy-800/80">
    <div class="gold-swoosh-topright"></div>
    <div class="gold-swoosh-bottom"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <!-- Grid layout 2 kolom: Teks di kiri, Foto di kanan -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            
            <!-- SISI KIRI: Teks & Tombol -->
            <div class="lg:col-span-7 space-y-4 text-left">
                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-navy-800/80 border border-gold-500/30 text-gold-400 text-xs font-semibold shadow-inner">
                    <span class="w-2 h-2 rounded-full bg-gold-400 animate-pulse"></span>
                    <span data-i18n="hero_hello">Hello, I'm</span>
                </div>
                
                <h1 class="text-5xl sm:text-6xl md:text-7xl font-black text-gold-gradient tracking-tight leading-none filter drop-shadow-md">
                    Adelia
                </h1>
                
                <p class="text-2xl sm:text-3xl text-white font-bold tracking-wide">
                    Accounting <span class="text-gold-500/60 font-light">|</span> Tax <span class="text-gold-500/60 font-light">|</span> Finance
                </p>

                <p class="text-slate-300 text-sm sm:text-base leading-relaxed max-w-xl pt-1 font-normal italic" data-i18n="hero_desc">
                    Saya adalah mahasiswa Akuntansi Perpajakan yang memiliki ketertarikan di bidang perpajakan, keuangan, serta manajemen aset.
                </p>

                <!-- Tombol Download CV & Ikon -->
                <div class="pt-4 flex items-center gap-3">
                    <button onclick="downloadCV()" class="px-6 py-3 rounded-xl bg-gold-400 hover:bg-gold-300 text-navy-950 font-extrabold text-sm tracking-wide transition shadow-gold-glow hover:scale-105 transform duration-200">
                        <span data-i18n="download_cv_hero">Download CV</span>
                    </button>
                    <button onclick="downloadCV()" class="w-11 h-11 rounded-xl bg-navy-950 border border-gold-400 hover:bg-gold-500/20 text-gold-400 flex items-center justify-center transition shadow-md" title="Download Document">
                        <i class="fa-solid fa-file-lines text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- SISI KANAN: Foto Profil (Sejajar di samping teks) -->
            <div class="lg:col-span-5 flex justify-center lg:justify-end relative">
                <div class="relative w-72 sm:w-80 md:w-96 h-80 sm:h-96 md:h-[420px]">
                    <div class="absolute inset-0 bg-gradient-to-tr from-gold-500/40 via-amber-600/20 to-navy-700/60 rounded-3xl transform rotate-3 blur-md"></div>
                    <div class="relative w-full h-full rounded-2xl overflow-hidden border-2 border-gold-500/60 shadow-glass-dark bg-navy-900">
                        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=800" 
                             alt="Adelia Portrait" class="w-full h-full object-cover object-top">
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
